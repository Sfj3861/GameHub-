name: Android APK

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check server JavaScript syntax
        run: node --check server/server.js

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build installable APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk GameHub-${GITHUB_REF_NAME}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameHub-APK
          path: GameHub-${GITHUB_REF_NAME}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GameHub ${{ github.ref_name }}
          body: |
            APK de GameHub generado por GitHub Actions.
            La publicación solo se realiza si las pruebas y la compilación terminan correctamente.
          files: GameHub-${{ github.ref_name }}.apk
