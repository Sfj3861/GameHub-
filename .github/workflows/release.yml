name: Android Release

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Test, build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check server JavaScript syntax
        run: node --check server/server.js

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build installable APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk GameHub-v0.4.0.apk

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.event.head_commit.message, 'release:')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0
          name: GameHub v0.4.0
          body: |
            GameHub 0.4.0 — APK instalable firmado con la clave de depuración de Android.
            La publicación solo se realiza después de pasar las pruebas y compilar la app.
          files: GameHub-v0.4.0.apk
